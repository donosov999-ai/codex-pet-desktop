[package]
name = "biruzik-desktop"
version = "0.2.55"
description = "Standalone desktop pet app for the Internet Immortality Project."
authors = ["Denis Onosov (ODV999)"]
license = "MIT"
repository = "https://github.com/donosov999-ai/codex-pet-desktop"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "codex_pet_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "biruzik-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tauri = { version = "2.11.2", features = ["macos-private-api", "tray-icon", "image-png", "image-ico", "protocol-asset"] }
tauri-plugin-opener = "2"
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["webp"] }

# macOS: raise the pet window above fullscreen apps and show it on every Space.
# Tauri's set_always_on_top only reaches the floating level (below fullscreen), so we touch NSWindow.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder"] }
# Typing watch. rdev used to do this, but its listener resolves every key through
# TSMGetInputSourceProperty, which asserts it runs on the main queue and killed the app with
# SIGTRAP. A raw event tap reads key codes and touches no text-input services.
core-graphics = "0.24"
core-foundation = "0.10"
