<!doctype html>
<meta charset="utf-8">
<title>app preview</title>
<!--
  The real renderer with a stubbed desktop bridge.

  Everything below the shell is genuine: renderer.html's markup, renderer.css, the animation
  module, the window layout maths and the growth layer. Only Tauri is faked, because a native
  window cannot be inspected from here and a Rust build takes minutes to answer a question about
  geometry. The stub records every resizeWindow call, so the frame the app WOULD ask for is drawn
  as a dashed outline around the pet — which is exactly how you see whether the head is clipped.

  Serve statically from src/app and open /dev/app-preview.html.
-->
<style>
  body{margin:0;font:13px system-ui;background:#e9e6df;color:#1a1a18;padding:16px}
  #frame{position:relative;margin:12px 0;background:#fff;box-shadow:0 6px 24px rgba(0,0,0,.14);
         outline:2px dashed #d05a4a;outline-offset:0;overflow:hidden}
  #frame iframe{border:0;width:100%;height:100%;display:block}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  button,select{font:13px system-ui;padding:6px 12px;border-radius:8px;border:1px solid #c9c7bd;background:#fff;cursor:pointer}
  code{background:#fff;padding:2px 6px;border-radius:5px}
</style>
<div class="row">
  <label>Slider size
    <select id="size">
      <option value="0.6">0.6 (min)</option>
      <option value="0.9" selected>0.9 (default)</option>
      <option value="1.4">1.4</option>
      <option value="1.8">1.8 (max)</option>
    </select>
  </label>
  <button id="care">One act of care</button>
  <button id="freeze">Freeze transitions</button>
  <span id="info">-</span>
</div>
<p>The dashed outline is the window the app asks the shell for. Anything of the pet outside it is
clipped in the real app.</p>
<div id="frame"></div>

<script type="module">
  const frame = document.getElementById("frame");
  const info = document.getElementById("info");
  let win = null;

  /// The REAL pack, not a hand-written stand-in.
  ///
  /// A stub only describes what its author remembered, and a forgotten field looks exactly like a
  /// broken app: the first version of this page omitted the care config, #careActions came up
  /// empty, and the care loop simply could not be exercised. Read pet.json off disk and add only
  /// what Tauri would have supplied — convertFileSrc is what normally turns the packed paths into
  /// loadable URLs, and without it the renderer falls back to the *Url fields.
  async function realPet() {
    // window.__petId picks the pack: a pack judged from a measurement sheet gets confirmed on the
    // real renderer before its anchors are trusted.
    const id = window.__petId || "biruzik";
    const base = `/resources/pets/${id}`;
    // cache: "reload" — the pack is edited between runs too (anchors were added to it), and a
    // cached pet.json makes a fresh field look like it was never written.
    const meta = await fetch(`${base}/pet.json`, { cache: "reload" }).then((r) => r.json());
    return {
      ...meta,
      sourceKind: "managed",
      spritesheetUrl: `${base}/spritesheet.webp`,
      care: { ...(meta.care || {}), spritesheetUrl: `${base}/care-spritesheet.webp` }
    };
  }

  function bridge(onResize) {
    return {
      getAppInfo: async () => ({ version: "0.0.0-preview" }),
      // careCount is settable from the page so the restore path can be exercised: wipe local
      // storage, say the pet was cared for N times, mount, and see what form comes back.
      getPreferences: async () => ({
        scale: 0.9, autoWander: false, naturalLife: false, alwaysOnTop: false,
        careCount: Number(window.__careCount) || 0
      }),
      savePreferences: async () => {},
      listPets: async () => ({ pets: [await realPet()], errors: [] }),
      getWindowState: async () => ({ alwaysOnTop: false }),
      setAlwaysOnTop: async () => {},
      setIgnoreMouseEvents: async () => {},
      // Three positional arguments, not an object: the first run recorded undefined x undefined.
      resizeWindow: async (width, height) => { onResize({ width, height }); },
      moveBy: async () => {},
      resetPosition: async () => {},
      centerPosition: async () => {},
      updateTrayState: async () => {},
      openDownloads: async () => {},
      openDataDir: async () => {}
    };
  }

  // The bridge has to exist BEFORE the renderer's module runs. Pointing the iframe at
  // renderer.html and assigning afterwards is too late — the app boots on load, finds no bridge
  // and stops at "Desktop bridge is not available", which is what the first run of this page
  // showed. So the document is built here: the real markup, a <base> so its relative paths still
  // resolve, and one line that takes the stub from this window before anything else executes.
  window.__mkBridge = () => bridge((size) => {
    frame.style.width = `${size.width}px`;
    frame.style.height = `${size.height}px`;
    info.textContent = `window ${size.width}×${size.height}`;
  });

  /// Force the browser to re-fetch the renderer's modules before mounting.
  ///
  /// Adding ?v= to the tags in renderer.html is not enough: those modules import each other by
  /// bare relative paths, and those inner URLs stay cached. A run on 2026-09-05 measured the OLD
  /// growth layer while the CSS and the window maths were new — the card was still a child of the
  /// pet and the fix looked like it had not worked. `cache: "reload"` revalidates the entry, so
  /// the module load that follows gets the file from disk.
  async function refreshModules() {
    const listing = await fetch("../renderer/").then((r) => (r.ok ? r.text() : "")).catch(() => "");
    const names = [...listing.matchAll(/href="([^"]+\.js)"/g)].map((m) => m[1]);
    await Promise.all(
      names.map((name) =>
        fetch(new URL(name, new URL("../renderer/", location.href)), { cache: "reload" }).catch(() => {})
      )
    );
    return names.length;
  }

  async function mount(scale) {
    await refreshModules();
    frame.innerHTML = "";
    const markup = await fetch("../renderer.html").then((response) => response.text());
    // ⚠️ BUST THE STYLESHEET CACHE TOO, not just the module.
    // The browser keys CSS by URL, so a live edit to renderer.css goes unseen while the scripts
    // reload — and a run then reports the OLD layout with the NEW maths. That happened here: the
    // window height was already the new formula while the stage was still centring the pet, and
    // the numbers looked like a failed fix rather than a stale file.
    const bust = Date.now();
    const prepared = markup
      .replace(
        /<head([^>]*)>/i,
        `<head$1><base href="/src/app/"><script>window.petDesktop = parent.__mkBridge();<\/script>`
      )
      .replace(/(<link[^>]+href=")([^"]+\.css)(")/gi, `$1$2?v=${bust}$3`)
      .replace(/(<script[^>]+src=")([^"]+\.js)(")/gi, `$1$2?v=${bust}$3`);
    const iframe = document.createElement("iframe");
    frame.append(iframe);
    await new Promise((resolve) => {
      iframe.onload = resolve;
      iframe.srcdoc = prepared;
    });
    win = iframe.contentWindow;
    await new Promise((r) => setTimeout(r, 900));
    const range = win.document.getElementById("scaleRange");
    if (range) { range.value = String(scale); range.dispatchEvent(new win.Event("input")); }
    await new Promise((r) => setTimeout(r, 500));
  }

  document.getElementById("size").onchange = (event) => mount(Number(event.target.value));
  // ⚠️ MEASURE WITH TRANSITIONS FROZEN.
  // #pet transitions its transform over 600ms, and inside this iframe that CSSTransition stays in
  // "running" for good — getComputedStyle keeps handing back the value the pet started from. A run
  // on 2026-09-05 read every size as 0.9 and made a correct layout look broken; the tell is a
  // measured scale that does not match the slider. Freeze first, then measure.
  document.getElementById("freeze").onclick = () => {
    const doc = win?.document;
    if (!doc) return;
    const style = doc.createElement("style");
    style.textContent = "*{transition:none !important;animation:none !important}";
    doc.head.append(style);
  };
  document.getElementById("care").onclick = () => {
    win?.document.getElementById("pet")?.click();
  };
  window.__preview = { mount, get win() { return win; } };
  mount(0.9);
</script>
