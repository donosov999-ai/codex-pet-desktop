<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Biruzik — pose inspector</title>
<!--
  A debugging window for the pet packs.

  The pet itself lives in a 250px transparent window with no chrome, which is the worst possible
  place to judge whether an animation is right: rows the app rarely enters are never seen at all,
  a frame clipped at the cell edge looks like art, and a row secretly filled with idle frames looks
  like a pet that simply does not walk. Every defect found in this deck so far was found by opening
  the atlas, not by watching the pet.

  So this page shows the atlas the way the app reads it: every state row, animated at the fps the
  pack declares, from the cell the pack declares, with the numbers next to it and the automatic
  checks run over the pixels. It is deliberately plain - it is a workbench, not a product.
-->
<style>
  :root {
    --ink: #1b1a17;
    --dim: #6f6b62;
    --line: #d9d5cb;
    --paper: #f4f2ec;
    --card: #fffdf8;
    --bad: #a32d2d;
    --warn: #b8791a;
    --good: #2f7a4a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: grid; grid-template-columns: 232px 1fr; height: 100vh; overflow: hidden;
  }
  aside { border-right: 1px solid var(--line); overflow-y: auto; background: var(--card); }
  aside h1 { font-size: 13px; margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .pack { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
          padding: 7px 14px; border: 0; background: none; cursor: pointer; font: inherit; color: inherit; }
  .pack:hover { background: #eeece4; }
  .pack[aria-current="true"] { background: #e4e9f0; font-weight: 600; }
  .pack .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; }
  .dot.ok { background: var(--good); }
  .dot.warn { background: var(--warn); }
  .dot.bad { background: var(--bad); }
  .pack .count { margin-left: auto; color: var(--dim); font-variant-numeric: tabular-nums; }

  main { overflow-y: auto; padding: 14px 18px 40px; }
  .bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
         position: sticky; top: 0; background: var(--paper); padding: 4px 0 10px; z-index: 2; }
  .bar label { display: flex; align-items: center; gap: 6px; color: var(--dim); }
  button, select, input[type="number"] {
    font: inherit; padding: 4px 10px; border: 1px solid var(--line);
    border-radius: 6px; background: var(--card); color: inherit; cursor: pointer;
  }
  h2 { margin: 4px 0 2px; font-size: 16px; }
  .meta { color: var(--dim); margin-bottom: 10px; }
  .meta b { color: var(--ink); font-weight: 600; }

  .issues { margin: 0 0 14px; padding: 10px 12px; border-radius: 8px;
            border: 1px solid var(--line); background: var(--card); }
  .issues ul { margin: 6px 0 0; padding-left: 18px; }
  .issues li { margin: 2px 0; }
  .issues .bad { color: var(--bad); }
  .issues .warn { color: var(--warn); }
  .issues .good { color: var(--good); }

  .row { display: grid; grid-template-columns: 150px auto 1fr; gap: 14px;
         align-items: start; padding: 10px 0; border-top: 1px solid var(--line); }
  .row-name { font-weight: 600; }
  .row-name small { display: block; font-weight: 400; color: var(--dim); font-variant-numeric: tabular-nums; }
  .stage { position: relative; background:
      repeating-conic-gradient(#e8e5dd 0 25%, #f7f5f0 0 50%) 0 0 / 16px 16px;
      border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .stage canvas { display: block; }
  .strip { display: flex; flex-wrap: wrap; gap: 3px; align-content: start; }
  .strip canvas { background:
      repeating-conic-gradient(#e8e5dd 0 25%, #f7f5f0 0 50%) 0 0 / 10px 10px;
      border: 1px solid var(--line); border-radius: 3px; }
  .strip canvas.clip { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad); }
  .empty { color: var(--dim); font-style: italic; padding: 18px 0; }
</style>
</head>
<body>
  <aside>
    <h1>Питомцы</h1>
    <div id="packs"></div>
  </aside>
  <main>
    <div class="bar">
      <label>Масштаб
        <select id="zoom">
          <option value="1">1x</option>
          <option value="1.5" selected>1.5x</option>
          <option value="2">2x</option>
          <option value="3">3x</option>
        </select>
      </label>
      <button id="playPause" type="button">Пауза</button>
      <button id="stepBack" type="button">← кадр</button>
      <button id="stepFwd" type="button">кадр →</button>
      <label><input id="showAnchors" type="checkbox"> точки крепления</label>
      <label><input id="showCell" type="checkbox"> границы клетки</label>
      <label><input id="onlyProblems" type="checkbox"> только с замечаниями</label>
      <span id="status" style="color: var(--dim)"></span>
    </div>
    <div id="body"></div>
  </main>
  <script src="./inspector.js" type="module"></script>
</body>
</html>
